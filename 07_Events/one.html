        function imageHiddener() {
            let ul = document.querySelector("ul");
            let list = ul.querySelectorAll("li");
            list.forEach((e) => {
                e.addEventListener("click", () => {                   
                    e.remove();
                })
            })
        }
        imageHiddener();
